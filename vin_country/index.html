<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIN → страна сборки</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#2a3240;
    --txt:#e6edf3; --dim:#8b97a8; --acc:#4ea1ff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .inputrow{display:flex;gap:10px}
  input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
        color:var(--txt);padding:14px 16px;font:600 20px/1 "Consolas",monospace;
        letter-spacing:2px;text-transform:uppercase;outline:none}
  input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(78,161,255,.15)}
  button{background:var(--acc);border:0;border-radius:10px;color:#04121f;
         font:600 15px/1 "Segoe UI",sans-serif;padding:0 22px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  .samples{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}
  .samples span{font-size:12px;color:var(--dim);padding:5px 10px;border:1px solid var(--line);
                border-radius:999px;cursor:pointer;font-family:Consolas,monospace}
  .samples span:hover{border-color:var(--acc);color:var(--acc)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:20px;margin-top:18px}
  .hero{display:flex;align-items:center;gap:18px}
  .flag{font-size:56px;line-height:1}
  .heroTxt .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .heroTxt .val{font-size:30px;font-weight:700}
  .heroTxt .reg{color:var(--dim);font-size:14px}

  .strip{display:flex;gap:3px;margin-top:18px;flex-wrap:wrap}
  .ch{width:34px;height:44px;border-radius:7px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:var(--panel2);
      border:1px solid var(--line);font:700 16px/1 Consolas,monospace}
  .ch i{font:400 9px/1 "Segoe UI";color:var(--dim);font-style:normal;margin-top:4px}
  .ch.wmi{border-color:var(--acc);color:var(--acc)}
  .ch.chk{border-color:var(--warn);color:var(--warn)}
  .ch.yr{border-color:var(--ok);color:var(--ok)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
        background:var(--line);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;margin-top:18px}
  .cell{background:var(--panel);padding:13px 15px}
  .cell b{display:block;color:var(--dim);font:400 11px/1.4 "Segoe UI";
          text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .cell span{font-size:15px;font-weight:600}
  .mono{font-family:Consolas,monospace}
  .good{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}

  .err{background:rgba(248,81,73,.1);border:1px solid var(--err);border-radius:12px;
       padding:14px 18px;margin-top:18px;color:#ffb3ae}
  .err ul{margin:6px 0 0;padding-left:20px}
  .note{color:var(--dim);font-size:12px;margin-top:12px}

  details{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  summary{cursor:pointer;padding:14px 18px;font-weight:600;user-select:none}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 18px;text-align:left;border-top:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  td:first-child{font-family:Consolas,monospace;color:var(--acc);width:90px}
  tbody tr:hover{background:var(--panel2)}
  #search{width:100%;border-radius:0;border:0;border-top:1px solid var(--line);
          font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;padding:10px 18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>VIN → страна сборки</h1>
  <div class="sub">Определение страны по 1–2 символам VIN (ISO 3780) + производитель по WMI</div>

  <div class="inputrow">
    <input id="vin" maxlength="25" placeholder="XTA21099062119828" autocomplete="off" spellcheck="false">
    <button id="go">Определить</button>
  </div>
  <div class="samples">
    <span>XTA21099062119828</span>
    <span>WVWZZZ1JZXW000010</span>
    <span>JTDKB20U387730456</span>
    <span>1HGCM82633A004352</span>
    <span>KMHDU46D58U012345</span>
    <span>LSVAM4184C2100001</span>
    <span>5YJ3E1EAXJF006588</span>
  </div>

  <div id="out"></div>

  <details>
    <summary>Справочник стран (все диапазоны VIN)</summary>
    <input id="search" placeholder="Поиск по стране или коду…" autocomplete="off">
    <table><thead><tr><th>Диапазон</th><th>Страна</th><th>Регион</th></tr></thead>
    <tbody id="tbl"></tbody></table>
  </details>
</div>

<script src="data.js"></script>
<script src="decoder.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function render(raw){
  const out = $("out");
  const vin = normalize(raw);
  if(!vin){ out.innerHTML = ""; return; }

  const r = decodeVin(raw);
  if(!r.ok){
    out.innerHTML = `<div class="err"><b>VIN не прошёл проверку</b><ul>${
      r.errors.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
    return;
  }

  const strip = [...r.vin].map((c,i)=>{
    let cls="", lbl=i+1;
    if(i<3) cls="wmi";
    if(i===8) { cls="chk"; lbl="кс"; }
    if(i===9) { cls="yr"; lbl="год"; }
    return `<div class="ch ${cls}">${c}<i>${lbl}</i></div>`;
  }).join("");

  const chk = r.check.valid
    ? `<span class="good">верный (${r.check.expected})</span>`
    : r.check.required
      ? `<span class="bad">неверный: ожидался ${r.check.expected}, стоит ${r.check.actual}</span>`
      : `<span class="warn">не совпал (${r.check.expected}) — в Европе не обязателен</span>`;

  const country = r.country
    ? `${esc(r.country)}`
    : `<span class="warn">код не в справочнике</span>`;

  const same = r.makerCountry && r.country && (r.makerCountry.includes(r.country) || r.country.includes(r.makerCountry));
  const mismatch = (r.makerCountry && r.country && !same)
    ? `<div class="note">Завод по WMI: <b>${esc(r.makerCountry)}</b> — уточнение к стране из диапазона.</div>` : "";

  out.innerHTML = `
  <div class="card">
    <div class="hero">
      <div class="flag">${flag(r.iso) || "🏳️"}</div>
      <div class="heroTxt">
        <div class="lbl">Страна сборки</div>
        <div class="val">${country}</div>
        <div class="reg">${esc(r.region)}${r.range?` · диапазон ${esc(r.range)}`:""}</div>
      </div>
    </div>
    <div class="strip">${strip}</div>
    <div class="grid">
      <div class="cell"><b>WMI (1–3)</b><span class="mono">${esc(r.wmi)}</span></div>
      <div class="cell"><b>Производитель</b><span>${r.maker?esc(r.maker):'<span class="warn">нет в базе</span>'}</span></div>
      <div class="cell"><b>Год выпуска</b><span>${esc(r.year.text)}</span></div>
      <div class="cell"><b>Код завода (11)</b><span class="mono">${esc(r.plant)}</span></div>
      <div class="cell"><b>Описание (VDS 4–9)</b><span class="mono">${esc(r.vds)}</span></div>
      <div class="cell"><b>Серийный номер</b><span class="mono">${esc(r.serial)}</span></div>
      <div class="cell"><b>Контрольный разряд</b><span>${chk}</span></div>
    </div>
    ${mismatch}
  </div>`;
}

function regionOf(ch){ const r = REGIONS.find(x=>x.chars.includes(ch)); return r?r.name:"—"; }

function buildTable(filter=""){
  const f = filter.trim().toLowerCase();
  $("tbl").innerHTML = COUNTRY_RANGES
    .filter(([rg,c]) => !f || rg.toLowerCase().includes(f) || c.toLowerCase().includes(f))
    .map(([rg,c,iso]) =>
      `<tr><td>${rg}</td><td>${flag(iso)} ${esc(c)}</td><td style="color:var(--dim)">${regionOf(rg[0])}</td></tr>`)
    .join("");
}

$("vin").addEventListener("input", e => render(e.target.value));
$("go").addEventListener("click", () => render($("vin").value));
$("vin").addEventListener("keydown", e => { if(e.key==="Enter") render($("vin").value); });
document.querySelectorAll(".samples span").forEach(s =>
  s.addEventListener("click", () => { $("vin").value = s.textContent; render(s.textContent); }));
$("search").addEventListener("input", e => buildTable(e.target.value));
buildTable();
</script>
</body>
</html>
