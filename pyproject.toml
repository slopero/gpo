[project]
name = "gpo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "basedpyright>=1.40.1",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.9",
    "sqlalchemy>=2.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "kiril",
    "views",
    "db",
    "controllers",
]

[tool.basedpyright]
typeCheckingMode = "strict"
include = [
    "app",
    "tests",
]
